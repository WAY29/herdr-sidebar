# Manifest for herdr-sidebar — the VS Code sidebar for herdr: file explorer,
# full-text search, and source control in one plugin (one pane by default,
# separated Explorer/Source Control panes on request via the ⚙ settings).
#
# Cross-platform notes (verified against herdr 0.7.1; see CLAUDE.md for the
# full findings list):
#  - Action ids must be GLOBALLY unique across platforms, so Windows launchers
#    use `-windows`-suffixed ids; both variants gate with the item-level
#    `platforms` key.
#  - herdr can NOT spawn a relative [[panes]] command on Windows — it resolves
#    the program against herdr's own directory (ERROR_PATH_NOT_FOUND) and
#    reports the plugin root as a `\\?\` verbatim path. Windows launches go
#    through wscript → the GUI-subsystem ensure sidecar → the socket API
#    (any console in a hook chain flashes a Windows Terminal window per focus
#    event on Windows 11). The [[panes]] entry below serves linux/macos only.
#  - Launchers dock the sidebar on the LEFT edge of the tab: `pane split` only
#    goes right/down, so they split the leftmost pane and `pane swap` the new
#    pane into the left slot.

id = "herdr-sidebar"
name = "herdr-sidebar"
version = "0.7.0"
description = "VS Code-style sidebar: file explorer, full-text search, and source control in one herdr pane."
min_herdr_version = "0.7.0"
platforms = ["linux", "macos", "windows"]

[[build]]
command = ["cargo", "build", "--release"]

# Declarative pane entries — linux/macos launch them directly with
# `plugin pane open`, so no interactive shell command is ever visible. The
# requested pane cwd is the workspace root, so resolve the binary through the
# host-injected plugin root instead of a relative command. No Windows
# [[panes]] entries: Windows keeps the absolute-path sidecar launchers below.
[[panes]]
id = "sidebar"
platforms = ["linux", "macos"]
title = "Sidebar"
placement = "split"
command = ["sh", "-c", 'exec "$HERDR_PLUGIN_ROOT/target/release/herdr-sidebar"']

[[panes]]
id = "explorer"
platforms = ["linux", "macos"]
title = "Explorer"
placement = "split"
command = ["sh", "-c", 'exec "$HERDR_PLUGIN_ROOT/target/release/herdr-sidebar" --view explorer']

[[panes]]
id = "git"
platforms = ["linux", "macos"]
title = "Source Control"
placement = "split"
command = ["sh", "-c", 'exec "$HERDR_PLUGIN_ROOT/target/release/herdr-sidebar" --view git']

[[panes]]
id = "quick-open"
platforms = ["linux", "macos"]
title = "Quick Open"
description = "Fuzzy-search files and folders in the current Sidebar root."
placement = "popup"
width = "80%"
height = "72%"
command = ["sh", "-c", 'exec "$HERDR_PLUGIN_ROOT/target/release/herdr-sidebar" --quick-open']

[[panes]]
id = "quick-open-windows"
platforms = ["windows"]
title = "Quick Open"
description = "Fuzzy-search files and folders in the current Sidebar root."
placement = "popup"
width = "80%"
height = "72%"
command = [
  "powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command",
  '& "$env:HERDR_PLUGIN_ROOT\\target\\release\\herdr-sidebar.exe" --quick-open',
]

# Toggle the sidebar: open left-docked / focus if unfocused / close if focused.
[[actions]]
id = "open-sidebar"
platforms = ["linux", "macos"]
title = "Toggle sidebar"
description = "Open the sidebar docked on the left (focus it if open; close it if focused)."
command = ["bash", "scripts/open-sidebar.sh"]

[[actions]]
id = "open-sidebar-windows"
platforms = ["windows"]
title = "Toggle sidebar"
description = "Open the sidebar docked on the left (focus it if open; close it if focused)."
command = ["wscript", "//B", "scripts/launch-ensure.vbs", "--toggle"]

[[actions]]
id = "quick-open"
platforms = ["linux", "macos"]
title = "Quick Open"
description = "Fuzzy-search files and folders in the current Sidebar root."
command = ["sh", "-c", 'exec "$HERDR_PLUGIN_ROOT/target/release/herdr-sidebar-ensure" --quick-open']

[[actions]]
id = "quick-open-windows"
platforms = ["windows"]
title = "Quick Open"
description = "Fuzzy-search files and folders in the current Sidebar root."
command = ["wscript", "//B", "scripts/launch-ensure.vbs", "--quick-open"]

[[actions]]
id = "open-file-link"
platforms = ["linux", "macos"]
title = "Open file link in Sidebar"
description = "Reveal a clicked local file link in Explorer and open it in Preview."
command = ["sh", "-c", 'exec "$HERDR_PLUGIN_ROOT/target/release/herdr-sidebar-ensure" --open-link']

[[actions]]
id = "open-file-link-windows"
platforms = ["windows"]
title = "Open file link in Sidebar"
description = "Reveal a clicked local file link in Explorer and open it in Preview."
command = ["wscript", "//B", "scripts/launch-ensure.vbs", "--open-link"]

[[link_handlers]]
id = "local-file"
platforms = ["linux", "macos"]
title = "Open local file in Sidebar"
pattern = '^(file://|/)'
action = "open-file-link"

[[link_handlers]]
id = "local-file-windows"
platforms = ["windows"]
title = "Open local file in Sidebar"
pattern = '^(file://|[A-Za-z]:[\\/])'
action = "open-file-link-windows"

# Separated-panels mode: open the Source Control pane on its own (the ⚙
# settings' "Unified sidebar: off"). The explorer side is what the sidebar
# opens by default.
[[actions]]
id = "open-git"
platforms = ["linux", "macos"]
title = "Toggle source control"
description = "Open a separate Source Control pane (focus it if open; close it if focused)."
command = ["bash", "scripts/open-git.sh"]

[[actions]]
id = "open-git-windows"
platforms = ["windows"]
title = "Toggle source control"
description = "Open a separate Source Control pane (focus it if open; close it if focused)."
command = [
  "powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command",
  '''$u=New-Object System.Text.UTF8Encoding($false); [Console]::OutputEncoding=$u; $OutputEncoding=$u; $b=$env:HERDR_BIN_PATH; if(-not $b){$b='herdr'}; $p=((& $b plugin list --json|ConvertFrom-Json).result.plugins|?{$_.plugin_id -eq 'herdr-sidebar'}).plugin_root; if($p -and $p.StartsWith('\\?\')){$p=$p.Substring(4)}; & (Join-Path (Join-Path $p 'scripts') 'open-git.ps1')''',
]

# Refresh every workspace onto the latest builds after a rebuild.
[[actions]]
id = "redeploy"
platforms = ["linux", "macos"]
title = "Redeploy sidebar panes"
description = "Close all sidebar panes in every workspace so they respawn on the latest build."
command = ["bash", "scripts/redeploy.sh"]

[[actions]]
id = "redeploy-windows"
platforms = ["windows"]
title = "Redeploy sidebar panes"
description = "Close all sidebar panes in every workspace so they respawn on the latest build."
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/redeploy.ps1"]

# Restored plugin panes resume as ordinary shells: labels survive a server
# restart, but the TUI process and heartbeat tokens do not. Startup runs after
# the persisted session is loaded, so replace the focused tab's corpse before
# waiting for a focus/create event that may never fire on first attach.
[[startup]]
platforms = ["linux", "macos"]
command = ["bash", "scripts/ensure-sidebar.sh"]

[[startup]]
platforms = ["windows"]
command = ["wscript", "//B", "scripts/launch-ensure.vbs"]

# Sidebar mode: on every tab/workspace focus, quietly ensure the focused tab
# has a left-docked sidebar (idempotent, never steals focus). A tab hooked at
# first focus still has its single full-height pane, so the sidebar becomes a
# full-height left column that later splits can't shorten.
# tab.created / workspace.created cover newly-created tabs/workspaces;
# pane.focused remains a fallback for any corpse encountered after startup.
# Hooking pane.* from a pane-creating script is only safe because open()
# holds its lock until the spawned TUI stamps its token — queued invocations
# then observe a LIVE pane and no-op instead of replace-looping.
[[events]]
on = "pane.focused"
platforms = ["linux", "macos"]
command = ["bash", "scripts/ensure-sidebar.sh"]

[[events]]
on = "pane.focused"
platforms = ["windows"]
command = ["wscript", "//B", "scripts/launch-ensure.vbs"]

[[events]]
on = "tab.created"
platforms = ["linux", "macos"]
command = ["bash", "scripts/ensure-sidebar.sh"]

[[events]]
on = "tab.created"
platforms = ["windows"]
command = ["wscript", "//B", "scripts/launch-ensure.vbs"]

[[events]]
on = "workspace.created"
platforms = ["linux", "macos"]
command = ["bash", "scripts/ensure-sidebar.sh"]

[[events]]
on = "workspace.created"
platforms = ["windows"]
command = ["wscript", "//B", "scripts/launch-ensure.vbs"]

[[events]]
on = "tab.focused"
platforms = ["linux", "macos"]
command = ["bash", "scripts/ensure-sidebar.sh"]

[[events]]
on = "workspace.focused"
platforms = ["linux", "macos"]
command = ["bash", "scripts/ensure-sidebar.sh"]

[[events]]
on = "tab.focused"
platforms = ["windows"]
command = ["wscript", "//B", "scripts/launch-ensure.vbs"]

[[events]]
on = "workspace.focused"
platforms = ["windows"]
command = ["wscript", "//B", "scripts/launch-ensure.vbs"]
